<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart: quarterly AWS spend at a fast-scaling SaaS company. Spend compounds at roughly 35 percent a quarter to a peak of 2.05 million euros in the fourth quarter, when the FinOps framework goes live; over the next two quarters it falls 22 percent to 1.6 million euros, worth 1.8 million euros a year against the pre-FinOps run-rate.">
  <rect width="360" height="160" rx="8" fill="var(--ct-paper)"/>
  <rect x="0.5" y="0.5" width="359" height="159" rx="7.5" fill="none" stroke="var(--ct-rule)"/>

  <!-- Furniture -->
  <rect class="ct-tab" x="14" y="11" width="19" height="2.6"/>
  <text class="ct-title" x="14" y="27">Bending the cloud cost curve</text>
  <text class="ct-sub" x="14" y="38">AWS spend, &#8364;m per quarter</text>
  <g class="svg-fade" style="--d:1.5s">
    <text class="ct-stat" x="346" y="30" text-anchor="end">22%</text>
    <text class="ct-note" x="346" y="39" text-anchor="end">AWS OPEX REDUCTION</text>
  </g>

  <!-- Post-framework period -->
  <rect class="svg-fade" style="--d:.1s" x="196.4" y="50" width="121.6" height="68" fill="var(--ct-panel)"/>

  <!-- Gridlines -->
  <line class="ct-gridline" x1="14" y1="50" x2="318" y2="50"/>
  <line class="ct-gridline" x1="14" y1="72.67" x2="318" y2="72.67"/>
  <line class="ct-gridline" x1="14" y1="95.33" x2="318" y2="95.33"/>
  <line class="ct-zero" x1="14" y1="118" x2="318" y2="118"/>

  <!-- Counterfactual: spend held at the Q4 run-rate -->
  <line class="ct-series-2 svg-fade" style="--d:.95s" x1="196.4" y1="71.53" x2="318" y2="71.53" stroke-dasharray="3.5 2.5"/>
  <text class="ct-lbl svg-fade" style="--d:1.05s" x="193" y="68" text-anchor="end">Pre-FinOps run-rate</text>
  <text class="ct-note svg-fade" style="--d:.2s" x="201" y="57">AFTER FINOPS</text>

  <!-- Actual spend -->
  <path class="ct-series svg-draw" style="--len:320;--d:.45s" d="M14,99.41 L74.8,92.84 L135.6,83.77 L196.4,71.53 L257.2,78.33 L318,81.73" stroke="var(--ct-s1)"/>
  <circle class="svg-pop" style="--d:1.35s" cx="318" cy="81.73" r="2.8" fill="var(--ct-accent)"/>
  <text class="ct-lbl svg-fade" style="--d:1.2s" x="310" y="92" text-anchor="end">&#8364;1.8m saved a year</text>

  <!-- Axes -->
  <g class="ct-tick">
    <line x1="14" y1="118" x2="14" y2="120.5"/>
    <line x1="74.8" y1="118" x2="74.8" y2="120.5"/>
    <line x1="135.6" y1="118" x2="135.6" y2="120.5"/>
    <line x1="196.4" y1="118" x2="196.4" y2="120.5"/>
    <line x1="257.2" y1="118" x2="257.2" y2="120.5"/>
    <line x1="318" y1="118" x2="318" y2="120.5"/>
  </g>
  <text class="ct-axis" x="14" y="130" text-anchor="middle">Q1</text>
  <text class="ct-axis" x="74.8" y="130" text-anchor="middle">Q2</text>
  <text class="ct-axis" x="135.6" y="130" text-anchor="middle">Q3</text>
  <text class="ct-axis" x="196.4" y="130" text-anchor="middle">Q4</text>
  <text class="ct-axis" x="257.2" y="130" text-anchor="middle">Q5</text>
  <text class="ct-axis" x="318" y="130" text-anchor="middle">Q6</text>
  <text class="ct-axis" x="322" y="52.8">3</text>
  <text class="ct-axis" x="322" y="75.47">2</text>
  <text class="ct-axis" x="322" y="98.13">1</text>
  <text class="ct-axis" x="322" y="120.8">0</text>

  <!-- Source -->
  <line class="ct-rule-line" x1="14" y1="141" x2="346" y2="141"/>
  <text class="ct-src" x="14" y="151">Source: PMG Services client engagement</text>
</svg>
