<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart: monthly manual reconciliation hours at a global manufacturer during its SAP S/4HANA migration. From a baseline of more than 400 hours a month, the workload falls with each of four cutover waves as twelve entities go live, reaching near zero once the last wave lands, releasing over 400 hours a month.">
  <rect width="360" height="160" rx="8" fill="var(--ct-paper)"/>
  <rect x="0.5" y="0.5" width="359" height="159" rx="7.5" fill="none" stroke="var(--ct-rule)"/>

  <!-- Furniture -->
  <rect class="ct-tab" x="14" y="11" width="19" height="2.6"/>
  <text class="ct-title" x="14" y="27">Retiring the manual month-end</text>
  <text class="ct-sub" x="14" y="38">Manual reconciliation, hours per month</text>
  <g class="svg-fade" style="--d:1.5s">
    <text class="ct-stat" x="346" y="30" text-anchor="end">400+</text>
    <text class="ct-note" x="346" y="39" text-anchor="end">HOURS SAVED PER MONTH</text>
  </g>

  <!-- Gridlines -->
  <line class="ct-gridline" x1="14" y1="50" x2="318" y2="50"/>
  <line class="ct-gridline" x1="14" y1="67" x2="318" y2="67"/>
  <line class="ct-gridline" x1="14" y1="84" x2="318" y2="84"/>
  <line class="ct-gridline" x1="14" y1="101" x2="318" y2="101"/>

  <!-- Bars: all start at the zero baseline -->
  <rect class="svg-rise" style="--d:.2s" x="27.4" y="50" width="34" height="68" fill="var(--ct-s1)"/>
  <rect class="svg-rise" style="--d:.38s" x="88.2" y="67" width="34" height="51" fill="var(--ct-s3)"/>
  <rect class="svg-rise" style="--d:.56s" x="149" y="85.7" width="34" height="32.3" fill="var(--ct-s3)"/>
  <rect class="svg-rise" style="--d:.74s" x="209.8" y="103.55" width="34" height="14.45" fill="var(--ct-s3)"/>
  <rect class="svg-rise" style="--d:.92s" x="270.6" y="115.96" width="34" height="2.04" fill="var(--ct-s3)"/>

  <line class="ct-zero" x1="14" y1="118" x2="318" y2="118"/>

  <!-- Entities live after each cutover wave -->
  <text class="ct-note svg-fade" style="--d:1.1s" x="318" y="63" text-anchor="end">ENTITIES LIVE ON S/4HANA</text>
  <text class="ct-axis svg-fade" style="--d:.5s" x="105.2" y="63" text-anchor="middle">3 live</text>
  <text class="ct-axis svg-fade" style="--d:.68s" x="166" y="81.7" text-anchor="middle">6 live</text>
  <text class="ct-axis svg-fade" style="--d:.86s" x="226.8" y="99.5" text-anchor="middle">9 live</text>
  <text class="ct-axis svg-fade" style="--d:1.04s" x="287.6" y="110" text-anchor="middle">12 live</text>

  <circle class="svg-pop" style="--d:1.35s" cx="287.6" cy="115.96" r="2.4" fill="var(--ct-accent)"/>

  <!-- Axes -->
  <g class="ct-tick">
    <line x1="44.4" y1="118" x2="44.4" y2="120.5"/>
    <line x1="105.2" y1="118" x2="105.2" y2="120.5"/>
    <line x1="166" y1="118" x2="166" y2="120.5"/>
    <line x1="226.8" y1="118" x2="226.8" y2="120.5"/>
    <line x1="287.6" y1="118" x2="287.6" y2="120.5"/>
  </g>
  <text class="ct-axis" x="44.4" y="130" text-anchor="middle">Baseline</text>
  <text class="ct-axis" x="105.2" y="130" text-anchor="middle">Wave 1</text>
  <text class="ct-axis" x="166" y="130" text-anchor="middle">Wave 2</text>
  <text class="ct-axis" x="226.8" y="130" text-anchor="middle">Wave 3</text>
  <text class="ct-axis" x="287.6" y="130" text-anchor="middle">Wave 4</text>
  <text class="ct-axis" x="322" y="52.8">400</text>
  <text class="ct-axis" x="322" y="69.8">300</text>
  <text class="ct-axis" x="322" y="86.8">200</text>
  <text class="ct-axis" x="322" y="103.8">100</text>
  <text class="ct-axis" x="322" y="120.8">0</text>

  <!-- Source -->
  <line class="ct-rule-line" x1="14" y1="141" x2="346" y2="141"/>
  <text class="ct-src" x="14" y="151">Source: PMG Services client engagement</text>
</svg>
