<svg viewBox="0 0 218 99" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart: variance to actual for a fixed annual budget against a driver-based rolling forecast, month by month. The annual budget drifts away from actual performance from March onwards and is 15 per cent adrift by December, while the rolling forecast stays within about one point of actual all year.">
  <rect width="218" height="99" rx="6" fill="var(--ct-paper)"/>
  <rect x="0.5" y="0.5" width="217" height="98" rx="5.5" fill="none" stroke="var(--ct-rule)"/>

  <!-- Furniture -->
  <rect class="ct-tab" x="10" y="7" width="11.5" height="2.2"/>
  <text class="ct-title" x="10" y="20">The budget expired in March</text>
  <text class="ct-sub" x="10" y="30">Variance to actual, %, by month</text>
  <g class="svg-fade" style="--d:1.45s">
    <text class="ct-stat" x="208" y="22" text-anchor="end">15%</text>
    <text class="ct-note" x="208" y="31" text-anchor="end">GAP BY DECEMBER</text>
  </g>

  <!-- Plot: gridlines at +20 and -5, black zero at 0 -->
  <line class="ct-gridline svg-fade" style="--d:.05s" x1="10" y1="38" x2="186" y2="38"/>
  <line class="ct-gridline svg-fade" style="--d:.05s" x1="10" y1="76" x2="186" y2="76"/>
  <line class="ct-zero svg-fade" style="--d:.12s" x1="10" y1="68.4" x2="186" y2="68.4"/>

  <!-- Series -->
  <path class="ct-series svg-draw" style="--len:200;--d:.35s" stroke="var(--ct-s1)"
        d="M10,68.4 L26,66.12 L42,63.08 L58,60.8 L74,58.82 L90,56.85 L106,55.02 L122,53.2 L138,51.38 L154,49.4 L170,47.42 L186,45.6"/>
  <path class="ct-series svg-draw" style="--len:200;--d:.62s" stroke="var(--ct-s4)"
        d="M10,67.64 L26,66.27 L42,69.16 L58,66.88 L74,69.01 L90,66.58 L106,69.31 L122,67.18 L138,67.03 L154,65.97 L170,66.88 L186,66.27"/>
  <circle class="svg-pop" style="--d:1.3s" cx="186" cy="45.6" r="2.2" fill="var(--ct-accent)"/>

  <!-- Direct labels -->
  <text class="ct-lbl svg-fade" style="--d:.95s" x="170" y="44.5" text-anchor="end" fill="var(--ct-s1)">Annual budget</text>
  <text class="ct-lbl svg-fade" style="--d:1.05s" x="184" y="75.5" text-anchor="end" fill="var(--ct-s4)">Rolling forecast</text>

  <!-- Axes -->
  <g class="ct-tick svg-fade" style="--d:.2s">
    <line x1="10" y1="76" x2="10" y2="78.5"/><line x1="58" y1="76" x2="58" y2="78.5"/>
    <line x1="106" y1="76" x2="106" y2="78.5"/><line x1="154" y1="76" x2="154" y2="78.5"/>
    <line x1="186" y1="76" x2="186" y2="78.5"/>
  </g>
  <g class="svg-fade" style="--d:.25s">
    <text class="ct-axis" x="10" y="85" text-anchor="middle">Jan</text>
    <text class="ct-axis" x="58" y="85" text-anchor="middle">Apr</text>
    <text class="ct-axis" x="106" y="85" text-anchor="middle">Jul</text>
    <text class="ct-axis" x="154" y="85" text-anchor="middle">Oct</text>
    <text class="ct-axis" x="186" y="85" text-anchor="middle">Dec</text>
    <text class="ct-axis" x="190" y="40.8">20</text>
    <text class="ct-axis" x="190" y="71.2">0</text>
    <text class="ct-axis" x="190" y="78.8">&#8722;5</text>
  </g>

  <!-- Source -->
  <line class="ct-rule-line" x1="10" y1="88" x2="208" y2="88"/>
  <text class="ct-src" x="10" y="94">Source: PMG Services engagements</text>
</svg>
