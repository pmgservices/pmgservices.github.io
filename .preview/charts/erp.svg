<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart: monthly manual admin time at an aviation startup before and after building an integrated finance system. Invoice entry falls from 32 hours to 4, cash reporting from 20 to 3 and ad-hoc analysis from 23 to 8, returning 60 hours a month to the finance team.">
  <rect width="360" height="160" rx="8" fill="var(--ct-paper)"/>
  <rect x="0.5" y="0.5" width="359" height="159" rx="7.5" fill="none" stroke="var(--ct-rule)"/>

  <!-- Furniture -->
  <rect class="ct-tab" x="14" y="11" width="19" height="2.6"/>
  <text class="ct-title" x="14" y="27">Where the finance month went</text>
  <text class="ct-sub" x="14" y="38">Manual admin time, hours per month</text>
  <g class="svg-fade" style="--d:1.5s">
    <text class="ct-stat" x="346" y="30" text-anchor="end">60h</text>
    <text class="ct-note" x="346" y="39" text-anchor="end">RETURNED PER MONTH</text>
  </g>

  <!-- Value-axis gridlines. The category axis is vertical here, so the
       gridlines run perpendicular to it, as on any horizontal bar chart. -->
  <g class="ct-gridline">
    <line x1="160" y1="54" x2="160" y2="118"/>
    <line x1="210" y1="54" x2="210" y2="118"/>
    <line x1="260" y1="54" x2="260" y2="118"/>
    <line x1="310" y1="54" x2="310" y2="118"/>
  </g>
  <line class="ct-zero" x1="110" y1="54" x2="110" y2="118"/>

  <!-- Series labels, stated once -->
  <g class="svg-fade" style="--d:1.2s">
    <text class="ct-lbl" x="130" y="59" text-anchor="middle" fill="var(--ct-s1)">After</text>
    <text class="ct-lbl" x="270" y="59" text-anchor="middle" fill="var(--ct-s4)">Before</text>
  </g>

  <!-- Invoice entry: 32h -> 4h -->
  <g class="svg-fade" style="--d:.15s">
    <text class="ct-lbl" x="14" y="69" fill="var(--ct-ink)">Invoice entry</text>
    <line x1="130" y1="66" x2="270" y2="66" stroke="var(--ct-s5)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="270" cy="66" r="3.2" fill="var(--ct-s4)"/>
    <circle cx="130" cy="66" r="3.2" fill="var(--ct-s1)"/>
    <text class="ct-axis" x="124" y="68.8" text-anchor="end">4</text>
    <text class="ct-axis" x="276" y="68.8">32</text>
  </g>

  <!-- Cash reporting: 20h -> 3h -->
  <g class="svg-fade" style="--d:.3s">
    <text class="ct-lbl" x="14" y="91" fill="var(--ct-ink)">Cash reporting</text>
    <line x1="125" y1="88" x2="210" y2="88" stroke="var(--ct-s5)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="210" cy="88" r="3.2" fill="var(--ct-s4)"/>
    <circle cx="125" cy="88" r="3.2" fill="var(--ct-s1)"/>
    <text class="ct-axis" x="119" y="90.8" text-anchor="end">3</text>
    <text class="ct-axis" x="216" y="90.8">20</text>
  </g>

  <!-- Ad-hoc analysis: 23h -> 8h -->
  <g class="svg-fade" style="--d:.45s">
    <text class="ct-lbl" x="14" y="113" fill="var(--ct-ink)">Ad-hoc analysis</text>
    <line x1="150" y1="110" x2="225" y2="110" stroke="var(--ct-s5)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="225" cy="110" r="3.2" fill="var(--ct-s4)"/>
    <circle cx="150" cy="110" r="3.2" fill="var(--ct-s1)"/>
    <text class="ct-axis" x="144" y="112.8" text-anchor="end">8</text>
    <text class="ct-axis" x="231" y="112.8">23</text>
  </g>

  <!-- Value axis -->
  <g class="ct-tick"><line x1="110" y1="118" x2="110" y2="120.5"/><line x1="160" y1="118" x2="160" y2="120.5"/><line x1="210" y1="118" x2="210" y2="120.5"/><line x1="260" y1="118" x2="260" y2="120.5"/><line x1="310" y1="118" x2="310" y2="120.5"/></g>
  <text class="ct-axis" x="110" y="128" text-anchor="middle">0</text>
  <text class="ct-axis" x="160" y="128" text-anchor="middle">10</text>
  <text class="ct-axis" x="210" y="128" text-anchor="middle">20</text>
  <text class="ct-axis" x="260" y="128" text-anchor="middle">30</text>
  <text class="ct-axis" x="310" y="128" text-anchor="middle">40</text>

  <!-- Source -->
  <line class="ct-rule-line" x1="14" y1="141" x2="346" y2="141"/>
  <text class="ct-src" x="14" y="151">Source: PMG Services client engagement</text>
</svg>
