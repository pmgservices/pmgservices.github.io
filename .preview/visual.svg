<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart: quarterly revenue forecast error for a pharmaceutical group. A shaded band showing the model's error range narrows from plus or minus 15 percent in the first quarter to plus or minus 3 percent by the fourth, with realised error converging on zero and forecast accuracy reaching 98 percent.">
  <rect width="360" height="160" rx="8" fill="var(--ct-paper)"/>
  <rect x="0.5" y="0.5" width="359" height="159" rx="7.5" fill="none" stroke="var(--ct-rule)"/>

  <!-- Furniture -->
  <rect class="ct-tab" x="14" y="11" width="19" height="2.6"/>
  <text class="ct-title" x="14" y="27">Closing the forecast gap</text>
  <text class="ct-sub" x="14" y="38">Revenue forecast error, %; band shows model range</text>
  <g class="svg-fade" style="--d:1.5s">
    <text class="ct-stat" x="346" y="30" text-anchor="end">98%</text>
    <text class="ct-note" x="346" y="39" text-anchor="end">FORECAST ACCURACY</text>
  </g>

  <!-- Drivers -->
  <text class="ct-note" x="14" y="50">DRIVERS · 28 IN MODEL</text>
  <line class="ct-rule-line" x1="14" y1="54" x2="92" y2="54"/>
  <g class="svg-fade" style="--d:.05s"><rect x="14" y="58.6" width="2.8" height="2.8" fill="var(--ct-s1)"/><text class="ct-lbl" x="21" y="65" fill="var(--ct-ink)">Revenue</text></g>
  <g class="svg-fade" style="--d:.12s"><rect x="14" y="74.6" width="2.8" height="2.8" fill="var(--ct-s2)"/><text class="ct-lbl" x="21" y="81" fill="var(--ct-ink)">Cost pool</text></g>
  <g class="svg-fade" style="--d:.19s"><rect x="14" y="90.6" width="2.8" height="2.8" fill="var(--ct-s3)"/><text class="ct-lbl" x="21" y="97" fill="var(--ct-ink)">Market data</text></g>
  <g class="svg-fade" style="--d:.26s"><rect x="14" y="106.6" width="2.8" height="2.8" fill="var(--ct-s4)"/><text class="ct-lbl" x="21" y="113" fill="var(--ct-ink)">Procedures</text></g>

  <!-- Drivers gather into one forecast -->
  <g class="ct-connector">
    <path class="svg-draw" style="--len:10;--d:.32s" d="M94,60 H104"/>
    <path class="svg-draw" style="--len:10;--d:.38s" d="M94,76 H104"/>
    <path class="svg-draw" style="--len:10;--d:.44s" d="M94,92 H104"/>
    <path class="svg-draw" style="--len:10;--d:.50s" d="M94,108 H104"/>
    <path class="svg-draw" style="--len:48;--d:.54s" d="M104,60 V108"/>
    <path class="svg-draw" style="--len:12;--d:.66s" d="M104,84 H116"/>
  </g>

  <!-- Plot -->
  <line class="ct-gridline" x1="120" y1="50" x2="318" y2="50"/>
  <line class="ct-gridline" x1="120" y1="118" x2="318" y2="118"/>

  <path class="ct-band svg-fade" style="--d:.85s" d="M120,50 C 180,58 250,72 318,77.2 L318,90.8 C 250,96 180,110 120,118 Z" fill="var(--ct-s3)" fill-opacity="0.14"/>
  <path class="ct-band svg-fade" style="--d:1s" d="M120,68.1 C 180,72 250,79 318,80.8 L318,87.2 C 250,89 180,96 120,99.9 Z" fill="var(--ct-s3)" fill-opacity="0.3"/>

  <line class="ct-zero" x1="120" y1="84" x2="318" y2="84"/>

  <path class="ct-series svg-draw" style="--len:240;--d:.7s" d="M120,55.7 C 142,72 165,95 186,99.9 C 208,105 232,81 252,74.9 C 274,68 298,83 318,86" stroke="var(--ct-ink)"/>
  <circle class="svg-pop" style="--d:1.35s" cx="318" cy="86" r="2.8" fill="var(--ct-accent)"/>

  <text class="ct-lbl ct-focal svg-fade" style="--d:1.45s" x="316" y="70" text-anchor="end">&#177;3% by Q4</text>

  <!-- Axes -->
  <g class="ct-tick"><line x1="120" y1="118" x2="120" y2="120.5"/><line x1="186" y1="118" x2="186" y2="120.5"/><line x1="252" y1="118" x2="252" y2="120.5"/><line x1="318" y1="118" x2="318" y2="120.5"/></g>
  <text class="ct-axis" x="120" y="130" text-anchor="middle">Q1</text>
  <text class="ct-axis" x="186" y="130" text-anchor="middle">Q2</text>
  <text class="ct-axis" x="252" y="130" text-anchor="middle">Q3</text>
  <text class="ct-axis" x="318" y="130" text-anchor="middle">Q4</text>
  <text class="ct-axis" x="322" y="52.8">15</text>
  <text class="ct-axis" x="322" y="86.8">0</text>
  <text class="ct-axis" x="322" y="120.8">&#8722;15</text>

  <!-- Source -->
  <line class="ct-rule-line" x1="14" y1="141" x2="346" y2="141"/>
  <text class="ct-src" x="14" y="151">Source: PMG Services client engagement</text>
</svg>
