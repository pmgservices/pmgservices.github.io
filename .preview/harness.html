<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Chart system — gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
 body{font-family:"Space Grotesk",sans-serif;background:#fff;margin:0;padding:14px;color:#0b1d2c}
 h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7a8a92;margin:22px 0 8px;font-weight:600}
 .card{background:#f4f6f8;border:1px solid #dde1ea;border-radius:1rem;overflow:hidden;display:flex;align-items:center;justify-content:center}
 .proj{width:496px;height:198px}
 .svc{width:305px;height:138px}
 .card svg{width:100%;height:100%;display:block}
 .rail{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
 .miss{color:#b61818;font-size:12px}
</style></head><body>
<div id="out"></div>
<script>
const PROJ=['forecasting','erp','cs-finops','cs-sap','cs-liquidity'];
const SVC=['svc-fpa','svc-automation','svc-ecosystem'];
async function load(n){try{const r=await fetch('charts/'+n+'.svg?'+Date.now());if(!r.ok)throw 0;return await r.text()}catch(e){return null}}
(async()=>{
 let html='';
 for(const n of PROJ.concat(SVC)){
   const t=await load(n); const svc=SVC.includes(n);
   html+='<h2>'+n+(svc?' — service card 305×138':' — project card 496×198')+'</h2>';
   if(!t){html+='<div class="miss">not written yet</div>';continue}
   html+='<div class="rail"><div class="project-card-future animate-in" style="padding:0;border:0;background:none;box-shadow:none"><div class="card '+(svc?'svc':'proj')+'">'+t+'</div></div></div>';
 }
 out.innerHTML=html;
 out.querySelectorAll('svg').forEach(s=>{if(!s.closest('.card'))return;s.setAttribute('class','project-svg')});
})();
</script></body></html>
